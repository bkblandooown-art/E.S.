<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPARKS - Editar Cliente</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/clienteDados.css">
    <link rel="stylesheet" href="../css/editaCriaCliente.css">
</head>

<body>
    <section class="container_clienteCadastro">
        <nav class="nav_menuCotainer">
            <div class="menuSup_boasVindas">
                <p>Seja Bem-vindo</p>
            </div>
        </nav>
        <div class="clienteHero_text">
            <h3>Editar Cliente</h3>
        </div>
        <section class="containerCliente">
            <div class="containerFormClient">
                <h3 class="containerTitulo">Dados do cliente</h3>
                <form class="FormClient" id="clientForm">
                    <div class="containerInput">
                        <label for="inputNome">Nome Completo</label>
                        <input class="inputClient" id="inputNome" name="nome" type="text"
                            aria-label="área de digitação do nome" placeholder="Digite o nome">
                    </div>

                    <div class="containerInput">
                        <label for="inputCpfCnpj">CPF/CNPJ</label>
                        <input class="inputClient" id="inputCpfCnpj" name="identificacao" type="text"
                            aria-label="área de digitação do CPF ou CNPJ">
                    </div>

                    <div class="containerInput">
                        <label for="inputEmail">E-mail de contato</label>
                        <input class="inputClient" id="inputEmail" name="email" type="email"
                            aria-label="área de digitação do email">
                    </div>

                    <div class="containerInput">
                        <label for="inputData">Data de Aniversário</label>
                        <input class="inputClient" id="inputData" name="aniversario" type="date"
                            aria-label="área de digitação do Aniversário">
                    </div>

                    <div class="containerInputContato">
                        <div class="containerInput_contato">
                            <label for="inputContato">WhatsApp/Telefone</label>
                            <input class="inputClient" id="inputContato" name="tel" type="tel"
                                aria-label="área de digitação do contato">
                        </div>
                    </div>
                </form>
            </div>

            <div class="containerFormVeiculo">
                <h3 class="containerTitulo">Adicionar Veículo</h3>
                <form class="FormVeiculo" id="veiculoForm">
                    <div class="containerInputVeiculo">
                        <label for="inputMarca">Marca</label>
                        <input class="inputVeiculo" id="inputMarca" name="marcaValor" type="text"
                            aria-label="área de digitação da marca" placeholder="Ex: Honda">
                    </div>

                    <div class="containerInputVeiculo">
                        <label for="inputModelo">Modelo</label>
                        <input class="inputVeiculo" id="inputModelo" name="modelValor" type="text"
                            aria-label="área de digitação do modelo do veículo" placeholder="Ex: CG 160 Titan">
                    </div>

                    <div class="containerInputVeiculo">
                        <label for="inputPlaca">Placa</label>
                        <input class="inputVeiculo" id="inputPlaca" name="placaValor" type="text"
                            aria-label="área de digitação da placa" placeholder="ABC-1234">
                    </div>
                    <div class="input_btn">
                        <button id="btnVeiculoAdiciona" type="submit">Adicionar Moto</button>
                    </div>
                </form>
            </div>

            <div class="listaVeiculosClient">
                <h3 class="containerTitulo">Veículos Ativos</h3>
                <table id="veiculosAtivos" class="veiculosClientDados">
                    <thead class="thead_ClienteVeiculos">
                        <tr class="rowThead">
                            <th class="head_cellDados">ID Veículo</th>
                            <th class="head_cellDados">Marca</th>
                            <th class="head_cellDados">Modelo</th>
                            <th class="head_cellDados">Placa</th>
                            <th class="head_cellDados">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyVeiculosAtivos">
                        <!-- Preenchido dinamicamente via JS -->
                    </tbody>
                </table>
            </div>

            <div class="listaVeiculosClient_historico">
                <h3 class="containerTitulo">Histórico de Veículos</h3>
                <table id="veiculosDesativados" class="veiculosClientDados">
                    <thead class="thead_ClienteVeiculos">
                        <tr class="rowThead">
                            <th class="head_cellDados">ID Veículo</th>
                            <th class="head_cellDados">Marca</th>
                            <th class="head_cellDados">Modelo</th>
                            <th class="head_cellDados">Placa</th>
                            <th class="head_cellDados">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyVeiculosHistorico">
                        <!-- Preenchido dinamicamente via JS -->
                    </tbody>
                </table>
            </div>

            <div class="input_btn">
                <button id="btnClientCancel" type="button">Voltar</button>
                <button id="btnClientAtualizar" type="submit" form="clientForm">Atualizar Dados</button>
            </div>

        </section>
    </section>
    <script src="../js/utilits/masks.js"></script>
    <script src="../js/utilits/generators.js"></script>
    <script src="../js/services/os-database.js"></script>
    <script src="../js/services/veiculo-database.js"></script>
    <script src="../js/services/cliente-database.js"></script>
    <script src="../js/pages/cliente-editar.js"></script>
</body>

</html>
