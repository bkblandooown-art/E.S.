<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> SPARKS - Aba de Clientes </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/clienteDados.css">
    <link rel="stylesheet" href="../css/abaClientes.css">

</head>

<body>
    <section class="container_clienteCadastro">
        <nav class="nav_menuCotainer">
            <div class="menuSup_boasVindas">
                <p>Seja Bem-vindo</p>
            </div>
        </nav>
        <div class="clienteHero_text">
            <h3>Clientes</h3>
            <div class="novoCliente">
                <button class="btn_clienteNew" id="btnNovoCliente">Novo Cliente</button>
            </div>
        </div>

        <section class="lista_clients">
            <div class="containerTabela-clientes">
                <table class="tabelaClientes" id="clienteTable">
                    <thead class="headTable">
                        <tr class="rowThead">
                            <td class="cellCliente-head" id="cellId">ID</td>
                            <td class="cellCliente-head" id="cellNome">Nome</td>
                            <td class="cellCliente-head" id="cellTell">WhatsApp</td>
                            <td class="cellCliente-head" id="cellEmail">Email</td>
                            <td class="cellCliente-head" id="cellVeiculo">Veiculos</td>
                            <td class="cellCliente-head" id="cellStatus">Status</td>
                            <td class="cellCliente-head" id="cellActions">Ações</td>
                        </tr>
                    </thead>

                    <tbody class="bodyTable" id="TbodyClient">
                        <tr class="rowTbody">
                            <td class="cellCliente-body" id="cellBodyId">000000000</td>
                            <td class="cellCliente-body" id="cellBodyNome">Meu Nome Completo</td>
                            <td class="cellCliente-body" id="cellBodyWhatsapp">(62) 99536-3281</td>
                            <td class="cellCliente-body" id="cellBodyEmail">meuemail@email.com</td>
                            <td class="cellCliente-body" id="cellBodyVeiculos">02</td>
                            <td class="cellCliente-body" id="cellBodyStatus">Ativo</td>
                            <td class="btn_cell"><button class="button_table" type="button"
                                    id="td_editarClient">Editar</button></td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </section>
    </section>
    <script src="../js/utilits/masks.js"></script>
    <script src="../js/utilits/generators.js"></script>
    <script src="../js/services/os-database.js"></script>
    <script src="../js/services/veiculo-database.js"></script>
    <script src="../js/services/cliente-database.js"></script>
    <script src="../js/pages/cliente.js"></script>
</body>

</html>
