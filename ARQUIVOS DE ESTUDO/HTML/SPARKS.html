<!DOCTYPE html>

<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<title> SPARKS </title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://gstatic.com" crossorigin>

	<link rel="stylesheet" href="./style/style.css">
	<link rel="stylesheet" href="./style/form.css">

</head>

<body>
	<section class="container_loginPage">
		<div class="hero_text">
			<h1>Otimize seu processo de produção</h1>
			<p>Transforme seu negócio e escale com segurança e confiança</p>
		</div>
		<article class="container_loginForm">
			<div class="title_form">
				<p>Acesse sua conta</p>
			</div>
			<div class="login_container">
				<form action="">
					<div class="input_email">
						<input class="inpt_email" id="inputEmail" type="email" name="email" aria-label="área de digitação do email"
							placeholder="Email" required>
					</div>
					<div class="input_senha">
						<input class="inpt_pass" id="inputPassword" type="password" name="password"
							aria-label="área de digitação da senha" placeholder="Senha" required>
					</div>
					<div class="input_btn">
						<button id="btnSubmit" type="submit">Entrar</button>
					</div>
					<div class="CR_senha">
						<a href="./recuperaSenha.html">esqueci minha senha</a>
					</div>
					<div class="link_cadastro">
						<a href="./cadastroUser.html">Não possui conta? Cadastre-se</a>
					</div>
				</form>
			</div>
		</article>
	</section>
	<script src="./JS/dataBase.js"></script>
	<script src="./JS/login.js"></script>

</body>

</html>
