<!DOCTYPE html>

<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title> SPARKS </title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>

  <link rel="stylesheet" href="./style/style.css">
  <link rel="stylesheet" href="./style/form.css">
  <link rel="stylesheet" href="./style/tabelaUser.css">

</head>

<body>

  <section class="container_tableUser">
    <div class="container_Tabela">
      <h2>Banco de dados Ficticio</h2>
      <table class="table_ext">
        <!-- 1. Cabeçalho isolado semanticamente -->
        <thead class="table_thead">
          <tr class="tr_row">
            <th class="td_cell" >Nome do Usuário</th>
            <th class="td_cell" >E-mail de Contato</th>
            <th class="td_cell" >Status</th>
            <th class="td_cell" >Ações</th>
          </tr>
        </thead>

        <!-- 2. Corpo principal contendo os dados gerados pela aplicação -->
        <tbody class="table_tbody">
          <tr class="tr_row">
            <td class="td_cell">Ana Silva</td>
            <td class="td_cell">ana.silva@email.com</td>
            <td class="td_cell">Ativo</td>
            <td class="td_button"><button class="button_table">delete</button></td>
          </tr>
          <tr class="tr_row">
            <td class="td_cell" >Carlos Santos</td>
            <td class="td_cell" >carlos.santos@email.com</td>
            <td class="td_cell" >Inativo</td>
            <td class="td_button" ><button class="button_table">delete</button></td>
          </tr>
        </tbody>

        <!-- 3. Rodapé reservado para resumos e totais -->
        <tfoot>
          <tr class="tr_row">
            <!-- Mesclando 3 colunas para o texto descritivo -->
            <th class="td_cell" colspan="3">Total de usuários cadastrados:</th>
            <!-- A última coluna recebe o valor real -->
            <td class="td_cell" >2</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </section>
</body>

</html>
