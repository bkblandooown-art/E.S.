<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> SPARKS </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>

    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/clienteDados.css">

</head>

<body>
    <section class="container_clienteCadastro">
        <nav class="nav_menuCotainer">
            <div class="menuSup_boasVindas">
                <p>Seja Bem-vindo</p>
            </div>
        </nav>
        <div class="clienteHero_text">
            <h3>Criar OS</h3>
        </div>
        <article class="container_clienteForm">
            <div class="title_form">
                <p>Digite os dados do cliente</p>
            </div>
            <div class="FormClient_container">
                <form action="submit" id="ClientForm">
                    <div class="input_container">
                        <Label class="label_nome" for="nome">Nome do Cliente</Label>
                        <input class="inpt_nome" id="inputNomeClient" type="text" name="nome"
                            aria-label="Nome do cliente" placeholder="Nome completo do cliente" required>
                    </div>
                    <div class="input_container">
                        <label class="label_CPF" for="cpf">CPF/CNPJ</label>
                        <input class="inpt_CPF" id="inputCPF"
                            pattern="(\d{3}\.?\d{3}\.?\d{3}-?\d{2})|(\d{2}\.?\d{3}\.?\d{3}/?\d{4}-?\d{2})" type="text"
                            name="cpf" aria-label="CPF do cliente" placeholder="00.000.000-00" required>
                    </div>
                    <div class="input_container">
                        <label class="label_tel" for="whatsapp">Contato/WhatsApp</label>
                        <input class="inpt_tel" id="inputTel" pattern="(\([0-9]{2}\))\s([9]{1})?([0-9]{4})-([0-9]{4})"
                            type="tel" name="whatsapp" aria-label="WhatsApp do cliente" placeholder="(00) 90000-0000"
                            required>
                    </div>
                    <div class="input_container">
                        <label class="label_marca" for="marca">Marca do veículo</label>
                        <input class="inpt_marca" id="inputMarcaVeiculo" type="text" name="marca"
                            aria-label="modelo do veículo do cliente" placeholder="Honda" required>
                    </div>
                    <div class="input_container">
                        <label class="label_veiculo" for="modelo">Modelo da veículo</label>
                        <input class="inpt_veiculo" id="inputModelVeiculo" type="text" name="modelo"
                            aria-label="modelo do veículo do cliente" placeholder="Titan 150 ES" required>
                    </div>
                    <div class="input_placaVeiculo">
                        <label class="label_placa" for="placa">Placa do veículo</label>
                        <input class="inpt_placa" id="inputPlaca" type="text" name="placa"
                            aria-label="Placa do veículo do cliente" placeholder="NFX0F01" required>
                    </div>
                    <div class="input_container-defeito">
                        <label class="label_defeito" for="defeito">Defeito relatado</label>
                        <input class="inpt_defeito" id="inputDefeito" type="area-text" name="defeito"
                            aria-label="Defeito relatado pelo cliente" placeholder="Explique o defeito relatado"
                            required>
                    </div>
            </div>
            <div class="input_btn">
                <button id="btnSubmitOS" type="submit">Criar OS</button>
            </div>
            </form>
            </div>
        </article>
        <hr class="divisor_form">
        <article class="art_os">
            <h2 class="title_OS">Lista de O.S.</h2>
            <div class="container_Tabela">
                <table class="table_OSExt">
                    <!-- 1. Cabeçalho isolado semanticamente -->
                    <thead class="table_thead">
                        <tr class="tr_rowHead">
                            <th class="td_cellHead">ID da OS</th>
                            <th class="td_cellHead">Nome do Cliente</th>
                            <th class="td_cellHead" id="cellModel">Modelo do Veículo</th>
                            <th class="td_cellHead">Placa</th>
                            <th class="td_cellHead">Status</th>
                            <th class="td_cellHead">Ações</th>
                        </tr>
                    </thead>

                    <!-- 2. Corpo principal contendo os dados gerados pela aplicação -->
                    <tbody class="table_tbody" id="tbodyOS">
                        <tr class="tr_row">
                            <td class="td_cell" id="td_id"></td>
                            <td class="td_cell" id="td_nome"></td>
                            <td class="td_cell" id="td_email"></td>
                            <td class="td_cell" id="td_senha"></td>
                            <td class="td_cell" id="td_status"></td>
                            <td class="td_button"><button class="button_table" type="button"
                                    id="td_editarOS">Editar</button></td>
                        </tr>
                    </tbody>

                    <!-- 3. Rodapé reservado para resumos e totais -->
                    <tfoot class="tfoot-total" id="footTotal">
                        <tr class="tr_rowFoot">
                            <!-- Mesclando 3 colunas para o texto descritivo -->
                            <th class="td_cellContador" colspan="5">Total de OS:</th>
                            <!-- A última coluna recebe o valor real -->
                            <td class="td_total-user" id="totalOS"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

        </article>
    </section>
    <script src="./JS/clienteDataBase.js"></script>
    <script src="./JS/veiculoDataBase.js"></script>
    <script src="./JS/OsDataBase.js"></script>
    <script src="./JS/abaOsCadastro.js"></script>
    <script src="./JS/listaOs.js"></script>
</body>

</html>
